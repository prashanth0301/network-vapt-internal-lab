version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: vapt-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaptpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vapt_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vapt} -d ${POSTGRES_DB:-vapt_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: vapt-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaptpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vapt_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ../reports:/app/reports
      - ../screenshots:/app/screenshots
      - ../wireshark:/app/wireshark
      - ../backend/logs:/app/logs

volumes:
  postgres_data:
